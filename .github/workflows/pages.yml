# ブラウザ用のテストページを GitHub Pages(リポジトリの内容を Web ページとして公開する機能)に公開する。
# 公開するのは scripts/build_web.py が作る _site/ だけ(ページのコードと、計算本体と、架空のデータ)。
# 実名のデータ・セーブデータは含まない。秘密情報は使わない。
# 使う前に、リポジトリの Settings → Pages で、Source を「GitHub Actions」にしておく(web/README.md)。
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/pennant/**"
      - "scripts/build_web.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # Actions の画面から手で実行できるようにする

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 使う部品(Action)は、書き換えられないよう commit の番号で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_web.py --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開の作業にだけ必要な権限(Pages への書き込みと、公開先の確認に使う一時的な証明)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
