# CI(GitHub 上で自動的にテストを走らせる仕組み)。回し方は D-279〜D-281:
# - PR:速いテスト(何も指定しない pytest)を 3 つの版(3.10・3.12・3.14)で回す。指紋の一致の確認もここに入る(D-281)。
#   計算本体(scripts/ci_needs_slow.py の範囲)が変わった PR だけ、重いテスト(pytest -m slow)も 3.12 で回す。
# - main への取り込み後:速いテストだけを 3.12 で回す。
# - 手動の実行(Actions の画面の「Run workflow」):速いテストと重いテストを 3.12 で回す。
# - 同じ PR を出し直したときは、古い実行を止める。
# 秘密情報は使わない。権限は読み取りのみ。外部の部品(Action)は今までと同じ 2 つだけ。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PR は 3 つの版、取り込み後と手動の実行は 1 つの版。3.14 はブラウザの中の Python と同じ版(D-089)
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10", "3.12", "3.14"]' || '["3.12"]') }}
    steps:
      # 使う部品(Action)は、書き換えられないよう commit の番号で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pytest==9.1.1"
      - name: Run pytest (速いテスト)
        run: pytest --durations=10

  # PR で計算本体が変わったかを調べる(変わったファイルの一覧を scripts/ci_needs_slow.py に渡す)
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      slow: ${{ steps.check.outputs.slow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD | tee changed.txt
          python3 scripts/ci_needs_slow.py < changed.txt >> "$GITHUB_OUTPUT"
          python3 scripts/ci_needs_slow.py < changed.txt

  pytest-slow:
    name: pytest slow (3.12)
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.slow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pytest==9.1.1"
      - name: Run pytest (重いテスト)
        run: pytest -m slow --durations=20
