# CI(GitHub 上で自動的にテストを走らせる仕組み)
# main への push と、PR のたびに pytest を実行する。
# 秘密情報は使わない。権限は読み取りのみ。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # 使う部品(Action)は、書き換えられないよう commit の番号で固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pytest==9.1.1"
      - name: Run pytest
        run: pytest
