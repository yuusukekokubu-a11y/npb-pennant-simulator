[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npb-pennant-simulator"
version = "0.0.0"
description = "プロ野球のペナントレース(シーズン全体の順位争い)シミュレーター(準備中)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 開発用の道具。`pip install -e ".[dev]"` で入る
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 生成設定・名前の部品(JSON)を一緒に入れる
pennant = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
