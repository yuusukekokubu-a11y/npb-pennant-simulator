[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npb-pennant-simulator"
version = "0.0.0"
description = "プロ野球のペナントレース(シーズン全体の順位争い)シミュレーター(準備中)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 開発用の道具。`pip install -e ".[dev]"` で入る
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 生成設定・名前の部品(JSON)を一緒に入れる
pennant = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 何も指定しない pytest は速いテストだけ(D-280)。重いテストだけは pytest -m slow、全部は pytest -m ""
addopts = ["-m", "not slow"]
markers = ["slow: 重いテスト(1 つで 10 秒以上かかるもの。複数シーズンを回すか、作るのに 15 秒以上かかるモジュール単位の準備(フィクスチャ)を使うもの。指紋の一致の確認は除く。D-280)。GitHub では計算本体が変わった PR と手動の実行で回す"]
